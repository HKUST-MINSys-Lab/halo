[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.1.0"
description = "Support-conditioned human-activity recognition from heterogeneous IMU recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy>=1.11,<1.17",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
eda = ["matplotlib", "torch"]
# Full training/eval stack: encoder text prototypes (sentence-transformers) + probes (scikit-learn).
model = ["torch", "torchaudio", "sentence-transformers", "scikit-learn"]
# Released UniMTS imports OpenAI CLIP; NormWear imports timm's patch utilities.
# CLIP 1.0.1 still imports pkg_resources, removed in setuptools 81.
baselines = ["halo[model]", "openai-clip==1.0.1", "timm>=1.0,<2", "setuptools>=68,<81"]

[project.scripts]
halo-train = "training.support_classifier.train:main"
halo-sealed-eval = "training.support_classifier.sealed_eval:main"
halo-scenarios = "training.support_classifier.run_scenarios:main"
halo-audit-curriculum = "training.support_classifier.curriculum_audit:main"
halo-dev-panel = "training.support_classifier.development_panel:main"
halo-rung1 = "evaluation.rung1_discovery.run:main"
halo-rung2 = "evaluation.rung2_unlabeled.run:main"
halo-rung4 = "evaluation.rung4_finetune.run:main"

[tool.setuptools.packages.find]
include = ["halo*", "baselines*", "data*", "model*", "training*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: needs cached sealed artifacts, a golden, or a training run; run explicitly",
]
