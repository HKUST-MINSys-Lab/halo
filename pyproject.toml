[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.1.0"
description = "Support-conditioned human-activity recognition from heterogeneous IMU recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy>=1.11,<1.17",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
eda = ["matplotlib", "torch"]
# Full training/eval stack: encoder text prototypes (sentence-transformers) + probes (scikit-learn).
model = ["torch", "torchaudio", "sentence-transformers", "scikit-learn"]

[project.scripts]
halo-train = "training.support_classifier.train:main"
halo-sealed-eval = "training.support_classifier.sealed_eval:main"
halo-scenarios = "training.support_classifier.run_scenarios:main"
halo-audit-curriculum = "training.support_classifier.curriculum_audit:main"
halo-dev-panel = "training.support_classifier.development_panel:main"

[tool.setuptools.packages.find]
include = ["halo*", "baselines*", "data*", "model*", "training*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
