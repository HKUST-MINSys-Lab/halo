[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.1.0"
description = "Support-conditioned human-activity recognition from heterogeneous IMU recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy>=1.11,<1.17",
]

[project.optional-dependencies]
dev = ["pytest"]
eda = ["matplotlib", "torch"]
# Full training/eval stack: encoder text prototypes (sentence-transformers) + probes (scikit-learn).
model = ["torch", "torchaudio", "sentence-transformers", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["baselines*", "data*", "eval*", "model*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
